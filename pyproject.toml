[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "minigit"
version = "0.1.0"
description = "Свой git на чистом Python без зависимостей: объекты, индекс, пакеты, diff, merge; хэши совпадают с настоящим git"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleg4311" }]
keywords = ["git", "version-control", "packfile", "diff", "merge"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Natural Language :: Russian",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5", "build"]

[project.scripts]
minigit = "minigit.cli:main"

[project.urls]
Homepage = "https://github.com/Oleg4311/byo-git-python"
Issues = "https://github.com/Oleg4311/byo-git-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/minigit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
